# Modified for MoinMoin, copied from: https://github.com/actions/starter-workflows/blob/main/ci/python-package.yml
# and https://github.com/borgbackup/borg/blob/master/.github/workflows/ci.yml

# This workflow will install Python dependencies, run tests and lint with a variety of Python versions and OSes
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches:
      - '**'
    tags:
      - '2.*'
  pull_request:
    branches:
      - master

jobs:
  lint:

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - name: Lint
      run: |
        pip install tox
        tox -e ruff
    - name: Test JavaScript
      run: node --test src/moin/static/js/_tests/test_common.js src/moin/static/js/_tests/test_search.js

  pytest:

    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
            # macOS: see the pytest_macos job below.
            - os: windows-latest
              python-version: '3.13'
            - os: ubuntu-24.04
              python-version: '3.12'
            - os: ubuntu-26.04
              python-version: '3.14'
            - os: ubuntu-24.04
              python-version: '3.15'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps: &pytest-steps
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install required system packages
      if: ${{ startsWith(matrix.os, 'ubuntu-') }}
      # required when building lxml from source
      run: |
        sudo apt-get update
        sudo apt-get install --yes libxml2-dev libxslt-dev
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        pip install -r requirements.d/development.txt
        pip install -e .
    - name: Test with pytest
      run: |
        pytest
    - name: Archive test artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-artifacts-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          _test_artifacts

  pytest_macos:
    # Same as the pytest job, but optional: GitHub's macOS runners are sometimes
    # not available for a long time ("The job was not acquired by Runner of type
    # hosted even after multiple attempts"), and that must not block a release.
    # So the release job does not wait for this job, and a failure here does
    # not make the workflow run fail.

    needs: lint
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
            - os: macos-latest
              python-version: '3.11'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps: *pytest-steps

  docs:

    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # set this to false as soon as docs building is fixed:
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        pip install -e .
    - name: Build Sphinx HTML
      working-directory: docs
      run: make html
    - name: Build Sphinx LaTeX (readthedocs builds PDF from LaTeX)
      working-directory: docs
      run: make latex

  release:
    # Build the sdist and the wheel and draft the GitHub release, after the
    # tests for the tagged commit have passed, see .github/workflows/release.yml.
    # The docs and pytest_macos jobs are optional, so they are not waited for.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [lint, pytest]

    permissions:
      contents: write
      id-token: write
      attestations: write

    uses: ./.github/workflows/release.yml

  pypi:
    # Upload the sdist and the wheel the release job built to PyPI.
    #
    # This job can not live in release.yml with the rest of the release code:
    # PyPI trusted publishing does not work from a reusable workflow, see
    # https://docs.pypi.org/trusted-publishers/troubleshooting/
    #
    # One-time setup, so that no API token has to be stored anywhere:
    #  - on pypi.org, add a trusted publisher to the "moin" project:
    #    owner "moinwiki", repository "moin", workflow "ci.yml",
    #    environment "pypi".
    #  - create the "pypi" environment in the repository settings and configure
    #    required reviewers for it (mandatory!): this makes this (irreversible)
    #    upload wait for a human approval, which is the last chance to stop a
    #    release.
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success' }}
    needs: [release]

    runs-on: ubuntu-26.04
    timeout-minutes: 30

    environment:
      name: pypi
      url: https://pypi.org/project/moin/${{ github.ref_name }}

    permissions:
      contents: read
      id-token: write  # trusted publishing

    steps:
    - name: Get the packages built by the release job
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: dist
        path: dist

    - name: What we are about to upload
      run: ls -l dist/

    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
